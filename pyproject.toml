[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geodesy-analysis"
version = "0.1.0"
description = "Scientific geodetic analysis algorithms and processing diagnostics"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "insar-data-adapter>=0.19.0",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
mask = ["Pillow>=9"]
table = ["pandas>=1.5", "openpyxl>=3.1"]
all = ["matplotlib>=3.7", "Pillow>=9", "pandas>=1.5", "openpyxl>=3.1"]

[project.scripts]
geodesy-analysis-gamma-baseline = "geodesy_analysis.insar.baseline_selection.gamma.cli:main"
geodesy-analysis-baseline-plot = "geodesy_analysis.insar.baseline_selection.common.plot_cli:main"
geodesy-analysis-gamma-interferogram = "geodesy_analysis.insar.interferogram_generation.gamma.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/geodesy-analysis/config_examples" = ["config_examples/*.cfg"]
