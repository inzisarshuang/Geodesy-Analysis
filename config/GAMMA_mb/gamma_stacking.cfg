# PATH CONTRACT / 处理链路径契约
# STEP / 步骤：ANALYSIS · GAMMA stacking
# RUN / 运行：geodesy-analysis-gamma-stacking --config PROJECT/config/GAMMA_mb/gamma_stacking.cfg --case main --dry-run
# 去掉 --dry-run 后正式运行。
# ROOT / 根目录：project=SENSOR/CASE；processing_root=SENSOR/CASE/METHOD。
# INPUTS / 输入：atmosphere_manifest、pair list、lookup 与地图 DEM。
# OUTPUTS / 输出：processing_root/TIMESERIES/STACKING 与对应 FIGURES、LOG。
# DOWNSTREAM / 下游：DataAdapter 和 Visualization 读取 timeseries_manifest.json。
# RERUN / 重跑：正式运行始终重新计算；成功后事务替换，失败保留旧结果。
# 查看帮助：geodesy-analysis-gamma-stacking --help
# 只检查：geodesy-analysis-gamma-stacking --config PROJECT/config/GAMMA_mb/gamma_stacking.cfg --case main --dry-run
# 正式运行：geodesy-analysis-gamma-stacking --config PROJECT/config/GAMMA_mb/gamma_stacking.cfg --case main

[project]
# 此项必须填写。研究项目根目录。
root = /path/to/research-project

[defaults]
# 参考区域窗口宽、高（像元），用于稳定平均速度参考。
reference_width = 15
reference_height = 15
# 快视图显示范围（m/year）和 GAMMA 色标。
display_min = -0.06
display_max = 0.06
colormap = hls.cm

[case:main]
# 数据 case、方法根、上游大气清单和实际使用的日期对列表。
project = S1/ASCENDING_128
processing_root = S1/ASCENDING_128/GAMMA_mb
atmosphere_manifest = S1/ASCENDING_128/GAMMA_mb/ATMOSPHERE/GAMMA_ATM_MOD_2D_AUTO/atmosphere_manifest.json
pair_list = S1/ASCENDING_128/GAMMA_mb/BASELINE/image_pairs_SBAS
# schema-v2 interferogram manifest 会提供 lookup、地图 DEM 及参数文件。
# 旧清单兼容入口：lookup_table、map_dem、map_dem_parameter。
# 零起始参考像元坐标。
reference_range = 0
reference_azimuth = 0
# output_dir = S1/ASCENDING_128/GAMMA_mb/TIMESERIES/STACKING
# figure_dir = S1/ASCENDING_128/GAMMA_mb/FIGURES/TIMESERIES/STACKING
# log_dir = S1/ASCENDING_128/GAMMA_mb/LOG/ANALYSIS/TIMESERIES/STACKING
