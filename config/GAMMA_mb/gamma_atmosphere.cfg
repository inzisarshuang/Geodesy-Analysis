# PATH CONTRACT / 处理链路径契约
# STEP / 步骤：ANALYSIS · GAMMA atmospheric correction
# ROOT / 根目录：project=SENSOR/CASE；processing_root=SENSOR/CASE/METHOD。
# INPUTS / 输入：DETRENDING/GAMMA_QUAD/detrending_manifest.json。
# OUTPUTS / 输出：processing_root/ATMOSPHERE/<METHOD> 与对应 FIGURES、LOG。
# DOWNSTREAM / 下游：DInSAR、stacking 和 GAMMA mb 读取 atmosphere_manifest.json。
# REUSE / 复用：完整同签名结果跳过；缺少快视图时只修复快视图。

[project]
root = /path/to/research-project

[defaults]
height_correlation_threshold = 0.1
intensity_background = true

[case:main]
project = S1/ASCENDING_128
processing_root = S1/ASCENDING_128/GAMMA_mb
detrending_manifest = S1/ASCENDING_128/GAMMA/DETRENDING/GAMMA_QUAD/detrending_manifest.json
method = gamma_atm_mod_2d_auto
# output_dir = S1/ASCENDING_128/GAMMA_mb/ATMOSPHERE/GAMMA_ATM_MOD_2D_AUTO
# figure_dir = S1/ASCENDING_128/GAMMA_mb/FIGURES/ATMOSPHERE/GAMMA_ATM_MOD_2D_AUTO
# log_dir = S1/ASCENDING_128/GAMMA_mb/LOG/ANALYSIS/ATMOSPHERE/GAMMA_ATM_MOD_2D_AUTO
