# =============================================================================
# PATH CONTRACT / 处理链路径契约
# STEP / 步骤：ANALYSIS · GAMMA quadratic detrending
# RUN / 运行：geodesy-analysis-gamma-quad-detrend --config PROJECT/config/GAMMA_mb/gamma_quad_detrending.cfg --case main --dry-run
# 去掉 --dry-run 后正式运行。
# PROJECT ROOT / 项目根目录：研究项目根。
# CASE ROOT / 数据项目：S1/ASCENDING_128。
# PROCESSING ROOT / 方法根：S1/ASCENDING_128/GAMMA_mb。
# INPUTS / 输入：<PROCESSING ROOT>/UNW/GAMMA_MCF/unwrapping_manifest.json。
# OUTPUTS / 输出：<PROCESSING ROOT>/DETRENDING/GAMMA_QUAD。
# FIGURES / 快视图：<PROCESSING ROOT>/FIGURES/DETRENDING/GAMMA_QUAD。
# DOWNSTREAM / 下游：大气改正或时序步骤读取本 manifest。
# RERUN / 重跑：正式运行始终完整重算；成功后科学结果与快视图一起替换。
# =============================================================================
# GAMMA quad spatial phase-trend removal
# Reads a complete GAMMA MCF unwrapping manifest and its verified filtering
# and interferogram lineage. The shared <project>/pairs.txt selects pairs.
# Usage:
#   geodesy-analysis-gamma-quad-detrend --help
#   geodesy-analysis-gamma-quad-detrend --config PROJECT/config/GAMMA_mb/gamma_quad_detrending.cfg --case main --dry-run
#   geodesy-analysis-gamma-quad-detrend --config PROJECT/config/GAMMA_mb/gamma_quad_detrending.cfg --case main
# =============================================================================

[project]
root = /path/to/research-project

[defaults]
# Coherence pixels at or above this value are used by quad_fit.
coherence_threshold = 0.15
# GAMMA quad_fit model terms below all include a constant. x is range and y is azimuth.
# 0 (default) adds x, y, xy, x², y². 1 adds x², y². 2 adds x, y, xy. 3 adds x, y.
# 4 adds x, x². 5 adds x. 6 adds y, y². 7 adds y.
trend_model = 0
# true (default) overlays phase on the master MLI. false displays phase alone.
# This setting only affects quicklooks.
intensity_background = true

[case:main]
project = S1/ASCENDING_128
processing_root = S1/ASCENDING_128/GAMMA_mb
unwrapping_manifest = S1/ASCENDING_128/GAMMA_mb/UNW/GAMMA_MCF/unwrapping_manifest.json
# output_dir is optional; the default is GAMMA/DETRENDING/GAMMA_QUAD.
# figure_dir defaults to GAMMA/FIGURES/DETRENDING/GAMMA_QUAD.

# Add further case sections for other sensors only after they publish a complete
# schema-v2 GAMMA MCF unwrapping manifest.
