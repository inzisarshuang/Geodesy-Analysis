# PATH CONTRACT / 处理链路径契约
# STEP / 步骤：ANALYSIS · InSAR filtering
# RUN / 运行：geodesy-analysis-filtering --config PROJECT/config/GAMMA_mb/insar_filtering.cfg --case nl_insar --dry-run
# 去掉 --dry-run 后正式运行。
# PROJECT ROOT / 项目根目录：研究项目根，例如 Gansu_Jishishan_LT1。
# CASE ROOT / 数据项目：S1/ASCENDING_128。
# PROCESSING ROOT / 方法根：S1/ASCENDING_128/GAMMA_mb。
# INPUTS / 输入：<PROCESSING ROOT>/INTF/interferogram_manifest.json。
# OUTPUTS / 输出：<PROCESSING ROOT>/FILTERING/<METHOD>。
# FIGURES / 快视图：<PROCESSING ROOT>/FIGURES/FILTERING/<METHOD>。
# DOWNSTREAM / 下游：GAMMA MCF 从所选 FILTERING/<METHOD> manifest 读取。
# RERUN / 重跑：正式运行始终完整重算；成功后科学结果与快视图一起替换。
# =============================================================================
# InSAR 干涉图滤波
# 功能用途：读取完整 interferogram_manifest.json，以 NL-InSAR、GAMMA BM3D 或
#           GAMMA ADF 滤波，并发布统一 filtering_manifest.json。
#
# 查看帮助：geodesy-analysis-filtering --help
# 只检查全部 case：
#   geodesy-analysis-filtering --config PROJECT/config/GAMMA_mb/insar_filtering.cfg --dry-run
# 正式运行一个 case：
#   geodesy-analysis-filtering --config PROJECT/config/GAMMA_mb/insar_filtering.cfg --case nl_insar
# =============================================================================

[project]
root = /path/to/research-project

[defaults]
# 以下参数用于 method = nl_insar，采用原始脚本的默认值。
search_window = 13
patch_size = 3
minimum_looks = 80
# 留空时根据 patch_size 和 seed 自动计算，也可填正数以指定带宽。
likelihood_h =
coherence_window = 11
filter_threshold = 0.3
tile_size = 96
point_threshold = 0.3
seed = 20260717

# 以下参数用于 method = gamma_bm3d，键名沿用旧 CFG。
# bm3d_mode 传给 GAMMA 的 dtype。干涉图使用 1（默认，FCOMPLEX）。
# GAMMA 的 0（FLOAT）和 2（图像）用于其他输入格式，其中 0 也不通过 CFG 正整数检查。
bm3d_mode = 1
# bm3d_sigma 传给 GAMMA 的 profile。对 FCOMPLEX 可填 2（直接 BM3D）或
# 6（默认，对缠绕干涉图执行 InSAR-BM3D）。噪声参数由 GAMMA 自动估计。
bm3d_sigma = 6
# bm3d_search_window 传给 GAMMA 的 looks，即等效视数。
bm3d_search_window = 10
bm3d_block_size = 8
# bm3d_block_step 传给 GAMMA 的最大搜索距离，bm3d_group_size 传给参考块步长。
bm3d_block_step = 16
bm3d_group_size = 3
# bm3d_transform 传给 GAMMA 的 d_max。0（默认）由数据估计像元值差异阈值，1 取消该限制。
# 此项用于 profile 2，profile 6 忽略此项。
bm3d_transform = 0

# 以下参数用于 method = gamma_adf。两遍滤波共用 alpha 和 steps。
adf_alpha = 0.4
adf_first_window = 64
adf_second_window = 16
adf_steps = 5

[case:nl_insar]
project = S1/ASCENDING_128
processing_root = S1/ASCENDING_128/GAMMA_mb
interferogram_manifest = S1/ASCENDING_128/GAMMA_mb/INTF/interferogram_manifest.json
# 若干涉图 output_dir 在项目外，interferogram_manifest 可填写它的绝对路径。
# 可选 nl_insar（非局部滤波）、gamma_bm3d（GAMMA BM3D）或 gamma_adf（两遍 GAMMA ADF）。
method = nl_insar
figure_dir = S1/ASCENDING_128/GAMMA_mb/FIGURES/FILTERING/NL_INSAR
# output_dir 可省略；自动使用 GAMMA/FILTERING/NL_INSAR。
# 手动指定时覆盖自动目录：
# output_dir = S1/ASCENDING_128/GAMMA_mb/FILTERING/NL_INSAR_CUSTOM

[case:gamma_bm3d]
project = S1/ASCENDING_128
processing_root = S1/ASCENDING_128/GAMMA_mb
interferogram_manifest = S1/ASCENDING_128/GAMMA_mb/INTF/interferogram_manifest.json
# 可选 nl_insar（非局部滤波）、gamma_bm3d（GAMMA BM3D）或 gamma_adf（两遍 GAMMA ADF）。
method = gamma_bm3d
figure_dir = S1/ASCENDING_128/GAMMA_mb/FIGURES/FILTERING/GAMMA_BM3D
# 自动使用 GAMMA/FILTERING/GAMMA_BM3D。

[case:gamma_adf]
project = S1/ASCENDING_128
processing_root = S1/ASCENDING_128/GAMMA_mb
interferogram_manifest = S1/ASCENDING_128/GAMMA_mb/INTF/interferogram_manifest.json
# 可选 nl_insar（非局部滤波）、gamma_bm3d（GAMMA BM3D）或 gamma_adf（两遍 GAMMA ADF）。
method = gamma_adf
figure_dir = S1/ASCENDING_128/GAMMA_mb/FIGURES/FILTERING/GAMMA_ADF
# 自动使用 GAMMA/FILTERING/GAMMA_ADF。

# 结果保存：每个方法目录包含 pairs/<日期对>/pair.tflt.filt、pair.coh.filt、
# coh_ave.coh、filtering_manifest.json 和 provenance.json。NL-InSAR 另有
# coherent_points/points.csv。
# 每个方法的 figure_dir 平铺保存 <日期对>.tflt.filt.bmp 和
# <日期对>.coh.filt.bmp；省略该键时自动使用同一标准目录，不建立图片 pairs/ 子目录。
# 日志：<processing_root>/LOG/ANALYSIS/FILTERING/<METHOD>/。
# 完成判断：命令返回 0，manifest status=complete，pair_count 与输入一致。
# 重新运行：无需删除旧结果；每次正式调用都会重算，成功后事务替换，失败保留旧结果。
# 路径：output_dir、figure_dir 可使用项目相对路径或任意绝对路径；
#       两者必须互不重叠，且不得覆盖 interferogram_manifest 输入。
# 凭据安全：本步骤不联网；CFG 和日志不得保存账号、密码、token 或 API key。
# =============================================================================
