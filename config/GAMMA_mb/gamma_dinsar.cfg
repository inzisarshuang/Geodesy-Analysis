# PATH CONTRACT / 处理链路径契约
# STEP / 步骤：ANALYSIS · single-pair GAMMA DInSAR displacement
# RUN / 运行：geodesy-analysis-gamma-dinsar --config PROJECT/config/GAMMA_mb/gamma_dinsar.cfg --case main --dry-run
# 去掉 --dry-run 后正式运行。
# ROOT / 根目录：project=SENSOR/CASE；processing_root=SENSOR/CASE/METHOD。
# INPUTS / 输入：ATMOSPHERE/<METHOD>/atmosphere_manifest.json 与一个 pair。
# OUTPUTS / 输出：processing_root/TIMESERIES/DINSAR 与对应 FIGURES、LOG。
# DOWNSTREAM / 下游：DataAdapter 和 Visualization 读取 timeseries_manifest.json。
# RERUN / 重跑：正式运行始终重新计算；成功后事务替换，失败保留旧结果。
# 查看帮助：geodesy-analysis-gamma-dinsar --help
# 只检查：geodesy-analysis-gamma-dinsar --config PROJECT/config/GAMMA_mb/gamma_dinsar.cfg --case main --dry-run
# 正式运行：geodesy-analysis-gamma-dinsar --config PROJECT/config/GAMMA_mb/gamma_dinsar.cfg --case main

[project]
# 必须填写研究项目根目录。
root = /path/to/research-project

[defaults]
# 雷达坐标和地理编码快视图的显示范围，单位为 m。
display_min = -0.03
display_max = 0.03
# GAMMA DISP 色标文件名。
colormap = hls.cm

[case:main]
# 数据 case 和 GAMMA_mb 方法根。
project = S1/ASCENDING_128
processing_root = S1/ASCENDING_128/GAMMA_mb
# 已完成的大气改正清单和本次只处理的一个日期对。
atmosphere_manifest = S1/ASCENDING_128/GAMMA_mb/ATMOSPHERE/GAMMA_ATM_MOD_2D_AUTO/atmosphere_manifest.json
pair = 20231027-20231226
# schema-v2 interferogram manifest 会提供 lookup、地图 DEM 及参数文件。
# 仅兼容缺少这些字段的旧清单时，才取消注释并填写真实文件名：
# lookup_table = S1/ASCENDING_128/GAMMA_mb/GEOCODING/<dem>.<reference>.<pol>.lt_fine
# map_dem = S1/ASCENDING_128/GAMMA_mb/GEOCODING/demcrop.dem
# map_dem_parameter = S1/ASCENDING_128/GAMMA_mb/GEOCODING/demcrop.dem_par
# output_dir = S1/ASCENDING_128/GAMMA_mb/TIMESERIES/DINSAR
# figure_dir = S1/ASCENDING_128/GAMMA_mb/FIGURES/TIMESERIES/DINSAR
# log_dir = S1/ASCENDING_128/GAMMA_mb/LOG/ANALYSIS/TIMESERIES/DINSAR
