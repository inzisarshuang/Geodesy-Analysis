# PATH CONTRACT / 处理链路径契约
# STEP / 步骤：ANALYSIS · single-pair GAMMA DInSAR displacement
# ROOT / 根目录：project=SENSOR/CASE；processing_root=SENSOR/CASE/METHOD。
# INPUTS / 输入：ATMOSPHERE/<METHOD>/atmosphere_manifest.json 与一个 pair。
# OUTPUTS / 输出：processing_root/TIMESERIES/DINSAR 与对应 FIGURES、LOG。
# DOWNSTREAM / 下游：DataAdapter 和 Visualization 读取 timeseries_manifest.json。
# REUSE / 复用：完整同签名结果跳过；缺少快视图时只修复快视图。

[project]
root = /path/to/research-project

[defaults]
display_min = -0.03
display_max = 0.03
colormap = hls.cm

[case:main]
project = S1/ASCENDING_128
processing_root = S1/ASCENDING_128/GAMMA_mb
atmosphere_manifest = S1/ASCENDING_128/GAMMA_mb/ATMOSPHERE/GAMMA_ATM_MOD_2D_AUTO/atmosphere_manifest.json
pair = 20231027-20231226
lookup_table = S1/ASCENDING_128/GAMMA/GEOCODING/lookup_table
map_dem = S1/ASCENDING_128/GAMMA/GEOCODING/demcrop.dem
map_dem_parameter = S1/ASCENDING_128/GAMMA/GEOCODING/demcrop.dem_par
# output_dir = S1/ASCENDING_128/GAMMA_mb/TIMESERIES/DINSAR
# figure_dir = S1/ASCENDING_128/GAMMA_mb/FIGURES/TIMESERIES/DINSAR
# log_dir = S1/ASCENDING_128/GAMMA_mb/LOG/ANALYSIS/TIMESERIES/DINSAR
