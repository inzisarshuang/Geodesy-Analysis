# PATH CONTRACT / 处理链路径契约
# STEP / 步骤：ANALYSIS · GAMMA mb SBAS/ISBAS
# ROOT / 根目录：project=SENSOR/CASE；processing_root=SENSOR/CASE/METHOD。
# INPUTS / 输入：atmosphere_manifest、pair list、最终 MCF mask、lookup 与地图 DEM。
# OUTPUTS / 输出：TIMESERIES/GAMMA_MB；位移序列分别在 DISPLACEMENT 与 DISPLACEMENT_GEO。
# DOWNSTREAM / 下游：DataAdapter 读取 DISPLACEMENT_GEO/displacement_geo_tab、images、
# final_mask.geo 及 timeseries_manifest.json。
# RERUN / 重跑：正式运行始终重新计算；成功后事务替换，失败保留旧结果。
# 查看帮助：geodesy-analysis-gamma-mb --help
# 只检查：geodesy-analysis-gamma-mb --config PROJECT/config/GAMMA_mb/gamma_sbas_mb.cfg --case main --dry-run
# 正式运行：geodesy-analysis-gamma-mb --config PROJECT/config/GAMMA_mb/gamma_sbas_mb.cfg --case main

[project]
# 【必填】研究项目根目录。
root = /path/to/research-project

[defaults]
# GAMMA mb 解算模式、相干阈值和最大时间间隔（天）。
mb_mode = 1
gamma = 0.5
dtmax = 70
# 控制平均速度、雷达坐标位移序列和地理编码位移序列是否生成。
generate_mean_geocoded = true
generate_displacement = true
generate_geocoded_displacement = true
# 快视图显示范围（m）和 GAMMA 色标。
display_min = -0.05
display_max = 0.05
colormap = hls.cm

[case:main]
# 数据 case、方法根、上游大气清单和实际参与反演的日期对列表。
project = S1/ASCENDING_128
processing_root = S1/ASCENDING_128/GAMMA_mb
atmosphere_manifest = S1/ASCENDING_128/GAMMA_mb/ATMOSPHERE/GAMMA_ATM_MOD_2D_AUTO/atmosphere_manifest.json
pair_list = S1/ASCENDING_128/GAMMA_mb/BASELINE/image_pairs_SBAS
# schema-v2 interferogram manifest 会提供 lookup、地图 DEM 及参数文件。
# 旧清单兼容入口：lookup_table、map_dem、map_dem_parameter。
# 零起始参考像元中心以及参考窗口宽、高。
reference_range = 0
reference_azimuth = 0
reference_width = 15
reference_height = 15
# visdt_pwr = /absolute/path/to/visdt_pwr.py
# output_dir = S1/ASCENDING_128/GAMMA_mb/TIMESERIES/GAMMA_MB
# figure_dir = S1/ASCENDING_128/GAMMA_mb/FIGURES/TIMESERIES/GAMMA_MB
# log_dir = S1/ASCENDING_128/GAMMA_mb/LOG/ANALYSIS/TIMESERIES/GAMMA_MB
