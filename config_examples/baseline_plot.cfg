# =============================================================================
# 独立基线网络绘图
# 功能用途：从 baseline_select_* 或 shortbaseline 重新绘制时空基线网络，
#           不调用 GAMMA，也不重新执行基线计算。
#
# 调用与运行示例：
#   geodesy-analysis-baseline-plot --config PROJECT/config/analysis/baseline_plot.cfg --case main
#   geodesy-analysis-baseline-plot /path/baseline_select_SBAS --master-date 20231222 --out /path/baseline.png
# =============================================================================

[project]
# 【必填】研究项目根目录；输入基线表和输出图片必须位于其中。
root = /path/to/research-project

[defaults]
# 图片标题；命令行 --title 可临时覆盖。
title = Perpendicular Baselines History
# 图片分辨率。
dpi = 300
# 图片宽度和高度，单位 inch，可用逗号或空格分隔。
figsize = 10.5, 6.2
# y 轴上、下额外留白，单位 m。
y_top_extra = 50
y_bottom_extra = 0
# 绘图字体。
font_family = TeX Gyre Heros

[case:main]
# 【必填】【常改】四列 baseline_select_* 或兼容 shortbaseline 文件。
baseline = ANALYSIS/GAMMA/main/BASELINE/baseline_select_SBAS
# 【必填】【常改】主影像 YYYYMMDD，绘制为红色并设相对垂直基线为 0。
master_date = 20231222
# 可选轨道标签，用于默认图名。
orbit = 128
# 可选输出目录；out 仅写文件名时从这里解析。
out_dir = ANALYSIS/GAMMA/main/BASELINE
# 可选输出文件；留空时根据 baseline 和 orbit 自动命名。
out =
