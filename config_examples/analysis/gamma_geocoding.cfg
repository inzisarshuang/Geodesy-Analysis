# PATH CONTRACT / 处理链路径契约
# STEP / 步骤：ANALYSIS · GAMMA interferogram geocoding
# ROOT / 根目录：继承 interferogram CFG 的 project 与 processing_root。
# INPUTS / 输入：TOPOGRAPHY/<dataset>/GAMMA DEM 与 RSLC 参考景。
# OUTPUTS / 输出：默认 processing_root/GEOCODING。
# DOWNSTREAM / 下游：INTF、滤波、解缠和去趋势复用雷达高程与 lookup。
# REUSE / 复用：随 INTF 完成清单按输入签名判断；缺图可单独修复。

# =============================================================================
# GAMMA 干涉图参考几何与地理编码
# 功能用途：为干涉图阶段按当前的 range_looks/azimuth_looks 重新生成参考 MLI、
#           DEM 覆盖区裁剪、lookup table 和与该 MLI 网格匹配的 WGS84 radar height。
# 路径：DEM 输入使用项目相对路径；output_dir 可用项目相对路径或任意绝对路径，
#       且不得与输入或干涉科学输出重叠。BMP 快视图另由 interferogram CFG 的
#       visualization_dir 指定，不混入 GEO 产品目录。
# =============================================================================
[project]
root = /path/to/research-project

[defaults]
correlation_threshold = 0.2
polynomial_parameters = 1
range_window = 128
azimuth_window = 128
area_factor = 1.0

[case:main]
# 原始 GAMMA DEM 和对应参数文件作为 gc_map2 输入。GAMMA 会按 SAR 覆盖范围
# 自动生成 demcrop.dem 和 demcrop.dem_par；后者用于地图坐标栅格的 data2geotiff。
dem = TOPOGRAPHY/jishishan_cop30/GAMMA/jishishan_cop30.dem
dem_par = TOPOGRAPHY/jishishan_cop30/GAMMA/jishishan_cop30.dem.par
# 可自定义的地理编码中间及高度产品目录。
output_dir = S1/ASCENDING_128/GAMMA/GEOCODING
