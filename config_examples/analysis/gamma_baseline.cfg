# =============================================================================
# GAMMA 基线网络选择
# 功能用途：读取 PRE 发布的 registered_stack.json，调用 GAMMA base_calc 建立
#           DSI、SBAS 或 PSI 网络并发布可移植清单；绘图由 Visualization 负责。
# 上一步：Geodesy-Preprocessing 已完成 RSLC 配准或裁剪。
# 下一步：geodesy-analysis-gamma-interferogram 生成干涉图与相干性。
#
# 查看帮助：
#   geodesy-analysis-gamma-baseline --help
# 只检查，不运行：
#   geodesy-analysis-gamma-baseline --config PROJECT/config/analysis/gamma_baseline.cfg --case main --dry-run
# 正式运行：
#   geodesy-analysis-gamma-baseline --config PROJECT/config/analysis/gamma_baseline.cfg --case main
# =============================================================================

[project]
# 【必填】【常改】研究项目根目录；所有输入和输出路径都限制在这里。
root = /path/to/research-project

[defaults]
# 【常改】SBAS 为多主影像小基线网络；DSI 不限制基线；PSI 为单主影像网络。
network_type = SBAS
# 【常改】最大垂直基线，单位 m；仅 SBAS 使用，DSI/PSI 保留以统一配置。
max_perpendicular_baseline = 300
# 【常改】最大时间基线，单位天；仅 SBAS 使用，DSI/PSI 保留以统一配置。
max_temporal_baseline = 100
# 【常改】本次分析的极化，必须覆盖注册栈的全部日期。
polarization = VV

[case:main]
# 【必填】【常改】正式 case 路径；CLI 的 main 只是选择标签，不决定目录名。
case_root = S1/ASCENDING_128
# 【必填】【常改】PRE 发布的 schema-v2 注册栈清单。
registered_stack = S1/ASCENDING_128/PRE/GAMMA/RSLC_SUBSET/registered_stack.json
# 【必填】本阶段固定结果目录，必须属于上述正式 case。
output_dir = S1/ASCENDING_128/ANALYSIS/BASELINE_SELECTION/GAMMA

# =============================================================================
# 参数说明
#   多个轨道或极化使用多个 [case:name]；name 只供 --case 选择，目录身份来自
#   case_root。不要把不同几何的栈混在一个正式 case。
#   参考日期直接读取注册栈，不能在本 CFG 另设一个冲突日期。
#
# 结果保存
#   output_dir 内包含 images、image_pairs_*、baseline_select_*、
#   baseline_manifest.json 和 provenance.json。Analysis 不生成任何图像。
#
# 日志
#   S1/ASCENDING_128/LOG/ANALYSIS/BASELINE_SELECTION/GAMMA 保存 base_calc stdout/stderr；
#   终端只显示统一进度。失败日志转存为 BASELINE.failed-logs-N。
#
# 完成判断
#   命令返回 0，baseline_manifest.json 可读，pair_count 大于 0且网络表非空。
#   新写出的清单为 schema v2；迁移期仍可读取已有 schema v1 结果。
#
# 重新运行
#   相同输入和参数的完整结果整体跳过；已有结果不完整或来源摘要不同则停止，
#   不静默覆盖。需要重算时先人工移动旧结果目录。
#
# 凭据安全
#   本步骤不联网，不需要账号、密码、API key 或 token；CFG 和日志不得保存凭据。
# =============================================================================
