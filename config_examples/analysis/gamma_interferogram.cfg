# PATH CONTRACT / 处理链路径契约
# STEP / 步骤：ANALYSIS · GAMMA interferogram/coherence/intensity
# ROOT / 根目录：project=SENSOR/CASE；processing_root=SENSOR/CASE/METHOD。
# INPUTS / 输入：RSLC[/SUBSET]、BASELINE 清单、GEOCODING CFG 和 pairs 网络。
# OUTPUTS / 输出：INTF/MLI 与 INTF/PAIRS/<pair>；相位/相干性同一 pair 目录。
# DOWNSTREAM / 下游：FILTERING、UNW、DETRENDING 与大气改正读取本阶段清单。
# REUSE / 复用：科学完整同签名时跳过；FIGURES/INTF 缺图只补图。

# =============================================================================
# GAMMA 干涉图生成
# 功能用途：读取 PRE 发布的 registered_stack.json 和基线阶段发布的
#           baseline_manifest.json，按本次视数重新地理编码参考 DEM，再生成干涉产品。
# 上一步：geodesy-analysis-gamma-baseline 已完成并发布基线清单。
# 下一步：后续滤波模块读取 interferogram_manifest.json，不扫描目录猜测数据。
#
# 查看帮助：
#   /home/yilun/miniconda3/envs/envInSAR/bin/geodesy-analysis-gamma-interferogram --help
# 只检查配置与输入，不运行 GAMMA：
#   /home/yilun/miniconda3/envs/envInSAR/bin/geodesy-analysis-gamma-interferogram --config /absolute/PROJECT/config/analysis/gamma_interferogram.cfg --case main --dry-run
# 正式运行：
#   /home/yilun/miniconda3/envs/envInSAR/bin/geodesy-analysis-gamma-interferogram --config /absolute/PROJECT/config/analysis/gamma_interferogram.cfg --case main
# =============================================================================
[project]
# 【必填】【常改】研究项目根目录；输入路径以此为基准，输出也可使用外部绝对路径。
root = /path/to/research-project

[defaults]
# 【常改】距离向和方位向视数；地理编码会在本次运行中按这组视数重新生成高程。
range_looks = 10
azimuth_looks = 2
# auto：Sentinel-1 关闭频谱滤波，其他卫星开启；也可明确填 on 或 off。
spectral_filter = auto

# 以下是 create_offset 高级参数，默认值继承原生产脚本，通常不需要修改。
create_offset_range_start = 0
create_offset_azimuth_start = 0
create_offset_range_window = 32
create_offset_azimuth_window = 32
create_offset_range_search = 64
create_offset_azimuth_search = 64
create_offset_correlation_threshold = 0.35

# 以下是 cc_wave 的距离向窗口、方位向窗口和估计方式。
coherence_range_window = 5
coherence_azimuth_window = 5
coherence_estimator = 2

[case:main]
# 【必填】【常改】正式 case 路径；CLI 的 main 只是选择标签，不决定目录名。
project = S1/ASCENDING_128
processing_root = S1/ASCENDING_128/GAMMA
# 【必填】【常改】PRE 最终发布的 schema-v2 RSLC 栈清单。
registered_stack = S1/ASCENDING_128/GAMMA/RSLC/SUBSET/registered_stack.json
# 【必填】【常改】同一 RSLC 栈经过基线选择后发布的清单。
baseline_manifest = S1/ASCENDING_128/GAMMA/BASELINE/baseline_manifest.json
geocoding_config = config/analysis/gamma_geocoding.cfg
# 【必填】【常改】本次处理极化；必须同时存在于注册栈和基线清单。
polarization = VV
# 【必填】【可自定义】干涉科学产品输出目录；可填绝对路径，且须避开输入及其他输出。
output_dir = S1/ASCENDING_128/GAMMA/INTF
# 【可选】【可自定义】干涉图/相干性/MLI BMP 输出目录，默认使用此标准路径。
figure_dir = S1/ASCENDING_128/GAMMA/FIGURES/INTF
# =============================================================================
# 参数说明
#   多个轨道、极化或不同视数使用不同 [case:name]；name 只供 --case 选择，
#   project 定义正式 case 身份。geocoding_config 中使用同名 case 设置 DEM 和
#   地理编码输出目录；参考日期从 registered_stack 读取，地理编码沿用本 CFG 视数。
#   create_offset 控制初始偏移、匹配窗口、搜索范围和最低相关阈值；只有配准质量
#   或轨道误差需要专项试验时才修改。cc_wave 参数控制最终相干性估计窗口。
#
# 容易出错
#   1. geocoding_config 中的 DEM 必须覆盖参考景并与 GAMMA DEM 参数文件匹配。
#   2. 地理编码会按 range_looks/azimuth_looks 在新目录生成 WGS84 radar height。
#   3. baseline_manifest 必须由完全相同的注册栈和极化产生。
#
# 结果保存
#   geocoding_config 的 output_dir：本次视数的 MLI、DEM lookup 和 WGS84 radar height；
#   output_dir/MLI：逐日期 MLI、MLI 参数和 ave_mli；
#   output_dir/PAIRS/<日期对>：int、off、baseline、int.flt、diff.par、
#   sim.topo.unw、tflt、cc；根目录发布 interferogram_manifest.json 和 provenance.json。
#   visualization_dir 平铺保存 <日期>.mli.bmp、ave_mli.bmp、
#   <日期对>.tflt.bmp 和 <日期对>.cc.bmp，不建立图片 pairs/ 子目录。
#   这些 GAMMA DISP 原生质检图由本阶段同步生成；地图和论文图仍由
#   Geodesy-Visualization 发布。
#
# 日志
#   S1/ASCENDING_128/LOG/ANALYSIS/INTERFEROGRAM_GENERATION/GAMMA 按日期、干涉对和命令保存；
#   失败时转存为 INTERFEROGRAM.failed-logs-N。终端显示进度和失败日志位置。
#
# 完成判断
#   命令返回 0，interferogram_manifest.json 的 status 为 complete，日期数和干涉对数
#   与 dry-run 一致，并且清单列出的全部文件非空。
#   新写出的 Analysis 清单为 schema v2；迁移期仍可读取 schema v1 基线清单。
#
# 重新运行
#   每次都重新运行；完整结果通过验证后，科学产品、GEO 产品与快视图目录一起替换。
#   GEO 相关产品集中放在 geocoding_config 的 output_dir；干涉图 BMP 按原规定单独放在
#   visualization_dir。
#   计算失败时保留旧目录。
#   生成路径可使用项目相对路径或任意绝对路径。
#   指定 --case 时只验证并运行该 case。
#
# 凭据安全
#   本步骤不联网，不需要账号、密码、API key 或 token；不要把凭据写进 CFG 或日志。
# =============================================================================
