# =============================================================================
# PATH CONTRACT / 路径契约
# PROJECT ROOT / 项目根目录：研究项目根。
# CASE ROOT / 数据项目：S1/ASCENDING_128。
# PROCESSING ROOT / 方法根：S1/ASCENDING_128/GAMMA。
# INPUT / 输入：<PROCESSING ROOT>/FILTERING/<METHOD>/filtering_manifest.json。
# OUTPUT / 科学输出：<PROCESSING ROOT>/UNW/GAMMA_MCF。
# FIGURES / 快视图：<PROCESSING ROOT>/FIGURES/UNW/GAMMA_MCF。
# DOWNSTREAM / 下游：GAMMA_QUAD 从 UNW/GAMMA_MCF manifest 读取。
# REUSE / 复用：完整且签名一致则跳过；只缺图时仅补图；残缺或签名变化时报错。
# =============================================================================
# GAMMA MCF 解缠
# 功能用途：显式读取一个完整 filtering_manifest.json，生成最终掩膜与参考点，
#           调用 GAMMA mcf 并发布统一 unwrapping_manifest.json。
# 查看帮助：geodesy-analysis-gamma-mcf --help
# 只检查：geodesy-analysis-gamma-mcf --config PROJECT/config/analysis/gamma_mcf_unwrapping.cfg --dry-run
# 正式运行：geodesy-analysis-gamma-mcf --config PROJECT/config/analysis/gamma_mcf_unwrapping.cfg --case main
# =============================================================================

[project]
root = /path/to/research-project

[defaults]
# GAMMA mcf mode，允许 0、1、2、3。
mcf_mode = 0
# auto 在最终掩膜内选择有限平均相干性的第一个最大值。
# manual 使用零起始 range/azimuth 像元坐标，并检查边界与掩膜。
reference_mode = auto
reference_range =
reference_azimuth =
coherence_threshold = 0.3
# 可选 BMP/TIFF 外部掩膜；指定后用 mask_operation 与相干掩膜组合。
external_mask =
mask_operation = and

[case:main]
project = S1/ASCENDING_128
processing_root = S1/ASCENDING_128/GAMMA
filtering_manifest = S1/ASCENDING_128/GAMMA/FILTERING/NL_INSAR/filtering_manifest.json
# 可选：仅对列表中的干涉对解缠；一行一个 YYYYMMDD-YYYYMMDD，# 开头为注释。
# 将 pairs.txt 放在方法根，例如 S1/ASCENDING_128/GAMMA/pairs.txt。
# 省略该文件时处理 filtering_manifest 中的全部干涉对；该文件可供其他处理阶段共用。
figure_dir = S1/ASCENDING_128/GAMMA/FIGURES/UNW/GAMMA_MCF
# output_dir 可省略；自动使用 GAMMA/UNW/GAMMA_MCF。
# 手动指定时覆盖自动目录，可使用项目相对路径或任意绝对路径：
# output_dir = S1/ASCENDING_128/GAMMA/UNW/GAMMA_MCF_CUSTOM

# 结果保存：mask/、pairs/<日期对>/pair.tflt.filt.unw、
# unwrapping_manifest.json 和 provenance.json。
# figure_dir 平铺保存 <日期对>.tflt.filt.unw.bmp；省略该键时自动使用
# 上述标准目录。计算输入 final.mask.bmp 仅保留在 Analysis 的 mask/ 目录。
# 日志：<processing_root>/LOG/ANALYSIS/UNW/GAMMA_MCF/。
# 完成判断：命令返回 0，manifest status=complete；pair_count 是本次选择的干涉对数。
# 重新运行：完整且签名一致时跳过；删除指定结果后可重新执行。
# case 根目录没有 pairs.txt 时处理全部 pair；存在时只解缠文件列出的 pair。
# 掩膜和自动参考点仍基于完整 filtering_manifest 的 coh_ave.coh。
# 解缠 manifest/provenance 记录选择清单、
# 摘要、可用 pair 总数与本次 pair 集合。
# output_dir 和 figure_dir 可使用项目相对路径或任意绝对路径；二者不得与
# 输入、彼此或解缠日志目录重叠。
# 凭据安全：本步骤不联网；CFG 和日志不得保存账号、密码、token 或 API key。
# =============================================================================
