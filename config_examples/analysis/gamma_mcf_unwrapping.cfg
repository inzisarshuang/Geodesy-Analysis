# =============================================================================
# GAMMA MCF 解缠
# 功能用途：显式读取一个完整 filtering_manifest.json，生成最终掩膜与参考点，
#           调用 GAMMA mcf 并发布统一 unwrapping_manifest.json。
# 查看帮助：geodesy-analysis-gamma-mcf --help
# 只检查：geodesy-analysis-gamma-mcf --config PROJECT/config/analysis/gamma_mcf_unwrapping.cfg --dry-run
# 正式运行：geodesy-analysis-gamma-mcf --config PROJECT/config/analysis/gamma_mcf_unwrapping.cfg --case main
# =============================================================================

[project]
root = /path/to/research-project

[defaults]
# GAMMA mcf mode，允许 0、1、2、3。
mcf_mode = 0
# auto 在最终掩膜内选择有限平均相干性的第一个最大值。
# manual 使用零起始 range/azimuth 像元坐标，并检查边界与掩膜。
reference_mode = auto
reference_range =
reference_azimuth =
coherence_threshold = 0.3
# 可选 BMP/TIFF 外部掩膜；指定后用 mask_operation 与相干掩膜组合。
external_mask =
mask_operation = and

[case:main]
case_root = S1/ASCENDING_128
filtering_manifest = S1/ASCENDING_128/ANALYSIS/FILTERING/NL_INSAR/filtering_manifest.json
visualization_dir = S1/ASCENDING_128/VISUALIZATION/UNWRAPPING/GAMMA_MCF
# output_dir 可省略；自动使用 ANALYSIS/UNWRAPPING/GAMMA_MCF。
# 手动指定时覆盖自动目录，但仍必须位于项目根内：
# output_dir = S1/ASCENDING_128/ANALYSIS/UNWRAPPING/GAMMA_MCF_CUSTOM

# 结果保存：mask/、pairs/<日期对>/pair.tflt.filt.unw、
# unwrapping_manifest.json 和 provenance.json。
# visualization_dir 平铺保存 <日期对>.tflt.filt.unw.bmp；省略该键时自动使用
# 上述标准目录。计算输入 final.mask.bmp 仅保留在 Analysis 的 mask/ 目录。
# 日志：<case_root>/LOG/ANALYSIS/UNWRAPPING/GAMMA_MCF/。
# 完成判断：命令返回 0，manifest status=complete，pair_count 与滤波清单一致。
# 重新运行：相同摘要跳过；不同输入或参数报冲突，不生成 run_id 或嵌套滤波方法。
# 凭据安全：本步骤不联网；CFG 和日志不得保存账号、密码、token 或 API key。
# =============================================================================
