# =============================================================================
# PATH CONTRACT / 路径契约
# PROJECT ROOT / 项目根目录：研究项目根。
# CASE ROOT / 数据项目：S1/ASCENDING_128。
# PROCESSING ROOT / 方法根：S1/ASCENDING_128/GAMMA。
# INPUT / 输入：<PROCESSING ROOT>/UNW/GAMMA_MCF/unwrapping_manifest.json。
# OUTPUT / 科学输出：<PROCESSING ROOT>/DETRENDING/GAMMA_QUAD。
# FIGURES / 快视图：<PROCESSING ROOT>/FIGURES/DETRENDING/GAMMA_QUAD。
# DOWNSTREAM / 下游：大气改正或时序步骤读取本 manifest。
# REUSE / 复用：完整且签名一致则跳过；只缺图时仅补图；残缺或签名变化时报错。
# =============================================================================
# GAMMA quad spatial phase-trend removal
# Reads a complete GAMMA MCF unwrapping manifest and its verified filtering
# and interferogram lineage. The shared <project>/pairs.txt selects pairs.
# Usage:
#   geodesy-analysis-gamma-quad-detrend --help
#   geodesy-analysis-gamma-quad-detrend --config PROJECT/config/analysis/gamma_quad_detrending.cfg --case main --dry-run
#   geodesy-analysis-gamma-quad-detrend --config PROJECT/config/analysis/gamma_quad_detrending.cfg --case main
# =============================================================================

[project]
root = /path/to/research-project

[defaults]
# Coherence pixels at or above this value are used by quad_fit.
coherence_threshold = 0.15
# GAMMA quad_fit model 0 is the legacy default; valid models are 0 through 7.
trend_model = 0
# true overlays phase on the master MLI; false uses the background-free style
# also used by GAMMA MCF. This changes quicklooks only, not phase data.
intensity_background = true

[case:main]
project = S1/ASCENDING_128
processing_root = S1/ASCENDING_128/GAMMA
unwrapping_manifest = S1/ASCENDING_128/GAMMA/UNW/GAMMA_MCF/unwrapping_manifest.json
# output_dir is optional; the default is GAMMA/DETRENDING/GAMMA_QUAD.
# figure_dir defaults to GAMMA/FIGURES/DETRENDING/GAMMA_QUAD.

# Add further case sections for other sensors only after they publish a complete
# schema-v2 GAMMA MCF unwrapping manifest.
