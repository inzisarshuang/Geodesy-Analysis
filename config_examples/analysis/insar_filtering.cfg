# =============================================================================
# InSAR 干涉图滤波
# 功能用途：读取完整 interferogram_manifest.json，以 NL-InSAR、GAMMA BM3D 或
#           GAMMA ADF 滤波，并发布统一 filtering_manifest.json。
#
# 查看帮助：geodesy-analysis-filtering --help
# 只检查全部 case：
#   geodesy-analysis-filtering --config PROJECT/config/analysis/insar_filtering.cfg --dry-run
# 正式运行一个 case：
#   geodesy-analysis-filtering --config PROJECT/config/analysis/insar_filtering.cfg --case nl_insar
# =============================================================================

[project]
root = /path/to/research-project

[defaults]
# NL-InSAR 原始脚本默认参数。
search_window = 13
patch_size = 3
minimum_looks = 80
# 留空时根据 patch_size 和固定 seed 自动计算。
likelihood_h =
coherence_window = 11
filter_threshold = 0.3
tile_size = 96
point_threshold = 0.3
seed = 20260717

# GAMMA BM3D：对应旧命令尾部 1 6 10 - 8 16 3 0 - -。
bm3d_mode = 1
bm3d_sigma = 6
bm3d_search_window = 10
bm3d_block_size = 8
bm3d_block_step = 16
bm3d_group_size = 3
bm3d_transform = 0

# GAMMA ADF：两遍窗口 64、16，共用 alpha=0.4 和 steps=5。
adf_alpha = 0.4
adf_first_window = 64
adf_second_window = 16
adf_steps = 5

[case:nl_insar]
case_root = S1/ASCENDING_128
interferogram_manifest = S1/ASCENDING_128/ANALYSIS/INTERFEROGRAM_GENERATION/GAMMA/interferogram_manifest.json
method = nl_insar
visualization_dir = S1/ASCENDING_128/VISUALIZATION/FILTERING/NL_INSAR
# output_dir 可省略；自动使用 ANALYSIS/FILTERING/NL_INSAR。
# 手动指定时覆盖自动目录：
# output_dir = S1/ASCENDING_128/ANALYSIS/FILTERING/NL_INSAR_CUSTOM

[case:gamma_bm3d]
case_root = S1/ASCENDING_128
interferogram_manifest = S1/ASCENDING_128/ANALYSIS/INTERFEROGRAM_GENERATION/GAMMA/interferogram_manifest.json
method = gamma_bm3d
visualization_dir = S1/ASCENDING_128/VISUALIZATION/FILTERING/GAMMA_BM3D
# 自动使用 ANALYSIS/FILTERING/GAMMA_BM3D。

[case:gamma_adf]
case_root = S1/ASCENDING_128
interferogram_manifest = S1/ASCENDING_128/ANALYSIS/INTERFEROGRAM_GENERATION/GAMMA/interferogram_manifest.json
method = gamma_adf
visualization_dir = S1/ASCENDING_128/VISUALIZATION/FILTERING/GAMMA_ADF
# 自动使用 ANALYSIS/FILTERING/GAMMA_ADF。

# 结果保存：每个方法目录包含 pairs/<日期对>/pair.tflt.filt、pair.coh.filt、
# coh_ave.coh、filtering_manifest.json 和 provenance.json。NL-InSAR 另有
# coherent_points/points.csv。
# 每个方法的 visualization_dir 平铺保存 <日期对>.tflt.filt.bmp 和
# <日期对>.coh.filt.bmp；省略该键时自动使用同一标准目录，不建立图片 pairs/ 子目录。
# 日志：<case_root>/LOG/ANALYSIS/FILTERING/<METHOD>/。
# 完成判断：命令返回 0，manifest status=complete，pair_count 与输入一致。
# 重新运行：输入和参数相同则跳过；不同则报冲突，不生成 main/test/run_id。
# 凭据安全：本步骤不联网；CFG 和日志不得保存账号、密码、token 或 API key。
# =============================================================================
